

 
    






<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bible Study App Pro Max</title>
<style>
:root { --bg:#fff8e1; --card:white; --text:#333; --main:#e65100; }
body.dark { --bg:#121212; --card:#1e1e1e; --text:#eee; --main:#ff9800; }
body{font-family:Arial;background:var(--bg);color:var(--text);padding:20px;margin:0}
.box{background:var(--card);padding:25px;border-radius:20px;max-width:900px;margin:auto}
h1{color:var(--main)}
.btn{background:var(--main);color:white;border:none;padding:10px 15px;border-radius:8px;cursor:pointer;font-weight:bold;margin:5px}
textarea,input{width:95%;padding:12px;font-size:16px;border:2px solid var(--main);border-radius:10px;margin:10px 0;background:var(--bg);color:var(--text)}
#result{font-size:18px;margin:20px 0;padding:15px;background:var(--bg);border-radius:10px;min-height:50px}
.tabs{display:flex;gap:10px;margin:15px 0}
.tab{flex:1;padding:10px;border:none;border-radius:8px;background:gray;color:white;cursor:pointer}
.tab.active{background:var(--main)}
</style>
</head>
<body>
<div class="box">
<div style="display:flex;justify-content:space-between">
<h1>📖 Bible Study Pro Max</h1>
<button class="btn" onclick="document.body.classList.toggle('dark')">🌙</button>
</div>

<div class="tabs">
<button class="tab active" onclick="showTab('translate')">Translate</button>
<button class="tab" onclick="showTab('dictionary')">Dictionary</button>
<button class="tab" onclick="showTab('bible')">Bible Verses</button>
</div>

<div id="translate">
<textarea id="text" placeholder="Type: He is risen"></textarea>
<button class="btn" onclick="translate()">🌍 Translate</button>
<button class="btn" onclick="speak()">🔊 Speak</button>
<div id="result"></div>
</div>

<div id="dictionary" style="display:none">
<input id="word" placeholder="Type word: faith, love">
<button class="btn" onclick="dictSearch()">Search</button>
<div id="dictResult"></div>
</div>

<div id="bible" style="display:none">
<input id="bibleSearch" placeholder="Search: mark16.6, john3:16">
<button class="btn" onclick="bibleSearch()">🔍 Search</button>
<div id="bibleResult"></div>
</div>

</div>
<script>
const translator = {"he is risen":"amefufuka","god loves you":"mungu anakupenda","jesus is lord":"yesu ni bwana","amen":"amina"};
const dict = {"god":"mungu","lord":"bwana","jesus":"yesu","faith":"imani","love":"upendo","grace":"neema","risen":"amefufuka"};
const bible = {"mark16:6":"He is risen! He is not here. / Amefufuka! Hayupo hapa.","john3:16":"For God so loved the world... / Kwa maana mungu aliupenda ulimwengu..."};

function showTab(tab){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.querySelectorAll('#translate, #dictionary, #bible').forEach(d=>d.style.display='none');event.target.classList.add('active');document.getElementById(tab).style.display='block'}
function translate(){let t=document.getElementById('text').value.toLowerCase().trim();document.getElementById('result').innerText=translator[t]||"Not found. Try: he is risen"}
function speak(){let t=document.getElementById('result').innerText;let s=new SpeechSynthesisUtterance(t);s.lang='sw-TZ';speechSynthesis.speak(s)}
function dictSearch(){let w=document.getElementById('word').value.toLowerCase();document.getElementById('dictResult').innerText=dict[w]||"Not found"}
function bibleSearch(){let q=document.getElementById('bibleSearch').value.toLowerCase().replace(/\./g,'');document.getElementById('bibleResult').innerHTML=bible[q]||"Not found. Try: mark16:6"}
</script>
</body>
</html>
