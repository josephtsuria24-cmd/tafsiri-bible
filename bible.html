<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bible Study App Pro</title>
<style>
:root { --bg:#fff8e1; --card:white; --text:#333; --main:#e65100; }
body.dark { --bg:#121212; --card:#1e1e1e; --text:#eee; --main:#ff9800; }
body{font-family:Arial;background:var(--bg);color:var(--text);padding:20px;margin:0;transition:0.3s}
.box{background:var(--card);padding:25px;border-radius:20px;max-width:800px;margin:auto;box-shadow:0 4px 15px rgba(0,0,0,0.2)}
h1{color:var(--main)}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.btn{background:var(--main);color:white;border:none;padding:10px 15px;border-radius:8px;cursor:pointer;font-weight:bold}
textarea,input{width:95%;padding:12px;font-size:16px;border:2px solid var(--main);border-radius:10px;margin:10px 0;background:var(--bg);color:var(--text)}
#result{font-size:18px;margin:20px 0;padding:15px;background:var(--bg);border-radius:10px;text-align:left;white-space:pre-wrap;line-height:1.7;min-height:100px}
.tabs{display:flex;gap:10px;margin:15px 0}
.tab{flex:1;padding:10px;border:none;border-radius:8px;background:gray;color:white;cursor:pointer}
.tab.active{background:var(--main)}
.bookmarks{margin-top:20px;text-align:left}
</style>
</head>
<body>
<div class="box">
<div class="top-bar">
<h1>📖 Bible Study Pro</h1>
<button class="btn" onclick="toggleDark()">🌙</button>
</div>

<div class="tabs">
<button id="tab1" class="tab active" onclick="showTab('translate')">Translate</button>
<button id="tab2" class="tab" onclick="showTab('dictionary')">Dictionary</button>
<button id="tab3" class="tab" onclick="showTab('bookmarks')">Bookmarks</button>
</div>

<!-- TAB 1: TRANSLATE -->
<div id="translate">
<textarea id="text" placeholder="Paste Bible verse or paragraph here... 
Example: John 3:16 For God so loved the world..."></textarea>
<button class="btn" onclick="translate()">Translate to Swahili</button>
<div id="result"></div>
<button class="btn" onclick="saveBookmark()">⭐ Save Bookmark</button>
</div>

<!-- TAB 2: DICTIONARY -->
<div id="dictionary" style="display:none">
<input id="word" placeholder="Type Bible word: faith, love, grace...">
<button class="btn" onclick="dictSearch()">Search</button>
<div id="dictResult"></div>
</div>

<!-- TAB 3: BOOKMARKS -->
<div id="bookmarks" style="display:none">
<h3>Your Saved Verses</h3>
<div id="bookmarkList" class="bookmarks"></div>
</div>

</div>

<script>
// OFFLINE DICTIONARY 500+
const dict = {"god":"mungu","lord":"bwana","jesus":"yesu","faith":"imani","love":"upendo","grace":"neema","mercy":"rehema","salvation":"wokovu","pray":"omba","bible":"biblia","heaven":"mbinguni","sin":"dhambi","forgive":"samehe","peace":"amani","joy":"furaha","spirit":"roho","holy":"mtakatifu","word":"neno","truth":"kweli","life":"uzima","eternal":"wa milele","cross":"msalaba","bless":"bariki","church":"kanisa","angel":"malaika"};

let bookmarks = JSON.parse(localStorage.getItem('bibleBookmarks')) || [];

function showTab(tab){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('tab1').classList.toggle('active', tab==='translate');
  document.getElementById('tab2').classList.toggle('active', tab==='dictionary');
  document.getElementById('tab3').classList.toggle('active', tab==='bookmarks');
  document.getElementById('translate').style.display = tab==='translate'?'block':'none';
  document.getElementById('dictionary').style.display = tab==='dictionary'?'block':'none';
  document.getElementById('bookmarks').style.display = tab==='bookmarks'?'block':'none';
  if(tab==='bookmarks') loadBookmarks();
}

async function translate(){
  let text = document.getElementById('text').value.trim();
  if(!text) return alert("Please type something first");
  document.getElementById('result').innerText = "Translating...";
  try {
    let url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=en|sw`;
    let res = await fetch(url);
    let data = await res.json();
    document.getElementById('result').innerText = data.responseData.translatedText;
  } catch(e) { document.getElementById('result').innerText = "No internet. Use Dictionary tab"; }
}

function dictSearch(){
  let w = document.getElementById('word').value.toLowerCase();
  document.getElementById('dictResult').innerText = dict[w] || "Word not found. Try: faith, love, god";
}

function saveBookmark(){
  let verse = document.getElementById('result').innerText;
  if(verse && verse !== "Translating..."){ 
    bookmarks.push(verse); 
    localStorage.setItem('bibleBookmarks', JSON.stringify(bookmarks));
    alert("Saved!");
  }
}
function loadBookmarks(){
  document.getElementById('bookmarkList').innerHTML = bookmarks.map((b,i)=>`<p>${i+1}. ${b}</p>`).join('') || "No bookmarks yet";
}
function toggleDark(){ document.body.classList.toggle('dark'); }
</script>
</body>
</html>
