<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Bible Study Pro Max</title>
<style>body{font-family:Arial;background:#fff8e1;padding:20px}.box{background:white;padding:25px;border-radius:20px;max-width:900px;margin:auto} h1{color:#e65100}.btn{background:#e65100;color:white;border:none;padding:10px 15px;border-radius:8px;cursor:pointer;font-weight:bold;margin:5px} textarea{width:95%;padding:12px;font-size:16px;border:2px solid #e65100;border-radius:10px} #result{font-size:18px;margin:20px 0;padding:15px;background:#fff8e1;border-radius:10px;min-height:50px}</style>
</head><body><div class="box"><h1>📖 Bible Study Pro Max</h1>
<textarea id="text" placeholder="Type: He is risen"></textarea><br>
<button class="btn" onclick="translate()">🌍 Translate</button>
<button class="btn" onclick="speak()">🔊 Speak</button>
<div id="result"></div></div>
<script>
const translator={"he is risen":"amefufuka","god loves you":"mungu anakupenda","jesus is lord":"yesu ni bwana","amen":"amina"};
function translate(){let t=document.getElementById('text').value.toLowerCase().trim();document.getElementById('result').innerText=translator[t]||"Not found. Try: he is risen, god loves you"}
function speak(){let t=document.getElementById('result').innerText;let s=new SpeechSynthesisUtterance(t);s.lang='sw-TZ';speechSynthesis.speak(s)}
</script></body></html>
